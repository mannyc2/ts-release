name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Package checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Exercise the package and the native Node Action launcher.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Cache bun installs
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Setup native Python acceptance
        if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.14"

      - name: Install pinned native Python fixtures
        if: runner.os == 'Linux'
        run: bun scripts/setup-native-python.ts

      - name: Install pinned native catalog consumers
        if: runner.os == 'Linux'
        run: bun run setup:native-catalog

      - name: Run release workflow and native fixture checks
        if: runner.os == 'Linux'
        run: bun run check:portable

      - name: Check macOS package imports and installed declarations
        if: runner.os == 'macOS'
        run: bun run check && bun run check:packed-kernel
