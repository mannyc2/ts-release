name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-program:
    name: Architecture program validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify lockfile stability
        run: git diff --exit-code -- bun.lock

      - name: Setup native Python acceptance
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.14"

      - name: Install pinned native Python fixtures
        run: bun scripts/setup-native-python.ts

      - name: Verify current architecture handoff and source tripwire
        run: bun run check:architecture-program

      - name: Verify exact selected-outcome ledger
        run: bun run check:launch-evidence

  portable:
    name: Portable package checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The packed npm consumer and certified npm publisher both require an
      # engine-admitted Node runtime. The Action itself is a composite/Bun
      # entrypoint, so this pin proves the package boundary rather than a
      # nonexistent JavaScript Action runtime.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Cache bun installs
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Setup native Python acceptance
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.14"

      - name: Install pinned native Python fixtures
        run: bun scripts/setup-native-python.ts

      - name: Run portable package checks
        run: bun run check:portable

  agent-host:
    name: Agent host validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache bun installs
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.219

      - name: Record Claude Code version
        run: claude --version

      - name: Run generated agent host checks
        run: bun run check:agents
