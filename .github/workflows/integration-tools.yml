name: Tool Integrations

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  codex-plugin-host:
    name: Codex plugin host validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Codex CLI
        # exact-pinned; bump deliberately
        run: npm install -g @openai/codex@0.146.0

      - name: Record tool version
        run: codex --version

      - name: Add local marketplace and install plugin
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          codex plugin marketplace add . --json
          codex plugin add ts-release@mannyc2-ts-release --json | tee "$RUNNER_TEMP/codex-install.json"

      - name: Assert installed plugin identity and tree
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          VERSION="$(jq -r .version package.json)"
          jq -e --arg v "$VERSION" \
            '.marketplaceName == "mannyc2-ts-release" and .version == $v' \
            "$RUNNER_TEMP/codex-install.json"
          INSTALLED="$(jq -r .installedPath "$RUNNER_TEMP/codex-install.json")"
          test -f "$INSTALLED/.codex-plugin/plugin.json"
          test -f "$INSTALLED/.claude-plugin/plugin.json"
          test -f "$INSTALLED/skills/release/SKILL.md"
          test -f "$INSTALLED/skills/release/references/recovery.md"

  claude-plugin-host:
    name: Claude plugin host validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Claude Code CLI
        # exact-pinned; bump deliberately
        run: npm install -g @anthropic-ai/claude-code@2.1.220

      - name: Record tool version
        run: claude --version

      - name: Strict plugin and marketplace validation
        run: |
          claude plugin validate ./ts-release-plugin --strict
          claude plugin validate . --strict

      - name: Add local marketplace and install plugin
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-home
        run: |
          claude plugin marketplace add ./
          claude plugin install ts-release@mannyc2-ts-release

      - name: Assert installed plugin identity and tree
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-home
        run: |
          VERSION="$(jq -r .version package.json)"
          CACHE="$CLAUDE_CONFIG_DIR/plugins/cache/mannyc2-ts-release/ts-release/$VERSION"
          test -f "$CACHE/.claude-plugin/plugin.json"
          test -f "$CACHE/.codex-plugin/plugin.json"
          test -f "$CACHE/skills/release/SKILL.md"
          test -f "$CACHE/skills/release/references/verification.md"
