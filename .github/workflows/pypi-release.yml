name: PyPI Release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit; it must be the current main tip.
        required: true
        type: string

permissions: {}

concurrency:
  group: pypi-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.repository == 'mannyc2/ts-release' && github.ref == 'refs/heads/main' && github.sha == inputs.candidate_sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: pypi-bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: pypi-bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Preload pinned cross-compile runtimes
        run: bun --no-env-file --no-install apps/ts-release-action/scripts/preload-bun-compile-runtimes.ts
      - name: Prepare exact wheel distributions
        run: bun --no-env-file --no-install apps/release-ts/scripts/prepare-pypi-distributions.ts .release/pypi-dist
      - name: Transfer wheel distributions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions-${{ github.run_attempt }}
          path: .release/pypi-dist/*.whl
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Retrieve wheel distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-distributions-${{ github.run_attempt }}
          path: dist
      - name: Publish wheel distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
