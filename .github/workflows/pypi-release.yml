name: PyPI Release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit; it must be the current main tip.
        required: true
        type: string

permissions: {}

concurrency:
  group: pypi-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.repository == 'mannyc2/ts-release' && github.ref == 'refs/heads/main' && github.sha == inputs.candidate_sha }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: pypi-bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: pypi-bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Preload pinned cross-compile runtimes
        run: bun --no-env-file --no-install apps/ts-release-action/scripts/preload-bun-compile-runtimes.ts
      - name: Prepare exact wheel distributions
        run: bun --no-env-file --no-install apps/release-ts/scripts/prepare-pypi-distributions.ts .release/pypi-dist
      - name: Transfer wheel distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-distributions-${{ github.run_attempt }}
          path: .release/pypi-dist/*.whl
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Retrieve wheel distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-distributions-${{ github.run_attempt }}
          path: dist
      - name: Publish wheel distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
