name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'mannyc2/ts-release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check:release
      - uses: ./apps/ts-release-action
        with:
          config: apps/release-ts/release.config.json
          prepared: .release/ts-release/prepared
          npm-token: ${{ secrets.NPM_TOKEN }}
          github-token: ${{ github.token }}
