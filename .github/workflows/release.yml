name: Release

# Preparation, npm OIDC no-upload certification, lightweight tagging, npm
# publication, and GitHub publication are five separate authorities. Protected
# jobs contain no
# third-party Actions: they bootstrap a digest-bound repository-owned closure,
# then execute only the exact detached candidate's local Action as mutation code.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Exact self-release authority
        required: true
        type: choice
        options:
          - prepare-exact-sha
          - certify-npm-oidc
          - create-tag
          - publish-npm
          - publish-github
      candidate_sha:
        description: Exact lowercase 40-hex current main commit.
        required: true
        type: string
      prepared_ref:
        description: GitHub or npm prepared:gha reference; mode-specific.
        required: false
        default: ""
        type: string
      npm_prepared_ref:
        description: Distinct npm prepared:gha reference; required only before GitHub publication.
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: ts-release-0.3.0
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-24.04
    outputs:
      selected_job: ${{ steps.admit.outputs.selected_job }}
    steps:
      - id: admit
        name: Admit one exact self-release authority
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PREPARED_REF: ${{ inputs.prepared_ref }}
          NPM_PREPARED_REF: ${{ inputs.npm_prepared_ref }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |-
          set -euo pipefail
          while IFS='=' read -r name _; do
            normalized="$(printf '%s' "$name" | /usr/bin/tr '[:upper:]' '[:lower:]')"
            case "$normalized" in
              npm_token|npm_id_token|node_auth_token|npm_config_*|prefix|destdir|node_options|node_path|node_extra_ca_certs|node_tls_reject_unauthorized|node_use_env_proxy|ssl_cert_file|ssl_cert_dir|openssl_conf|http_proxy|https_proxy|all_proxy|no_proxy|curl_ca_bundle|bun_options|bun_config_*|ld_preload|ld_library_path|dyld_insert_libraries|dyld_library_path|dyld_framework_path|git_*)
                echo "::error title=Unsafe release host::$name must be absent."
                exit 1
                ;;
            esac
          done < <(/usr/bin/env)
          refuse() {
            echo "::error title=Self-release admission refused::$1"
            exit 1
          }
          [[ "$GITHUB_REPOSITORY" == mannyc2/ts-release ]] || refuse "Repository coordinate is not canonical."
          [[ "$GITHUB_REPOSITORY_ID" == 1271545637 ]] || refuse "Repository identity is not canonical."
          [[ "$GITHUB_REPOSITORY_OWNER_ID" == 126291407 ]] || refuse "Repository owner identity is not canonical."
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || refuse "Event is not workflow_dispatch."
          [[ "$GITHUB_REF" == refs/heads/main ]] || refuse "Dispatch ref is not exact main."
          [[ "$GITHUB_WORKFLOW" == Release ]] || refuse "Workflow name is not canonical."
          [[ "$GITHUB_WORKFLOW_REF" == mannyc2/ts-release/.github/workflows/release.yml@refs/heads/main ]] ||
            refuse "Workflow ref is not exact main."
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]] || refuse "Run id is not canonical."
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || refuse "Run attempt is not canonical."
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]] || refuse "Candidate SHA is not canonical."
          [[ "$GITHUB_SHA" == "$CANDIDATE_SHA" ]] || refuse "Checked-out workflow SHA differs from the candidate."
          [[ "$GITHUB_WORKFLOW_SHA" == "$CANDIDATE_SHA" ]] || refuse "Workflow definition SHA differs from the candidate."

          prepared_pattern='^prepared:gha:mannyc2/ts-release/runs/([1-9][0-9]*)/attempts/([1-9][0-9]*)/artifacts/ts-release-prepared-([1-9][0-9]*)-([a-f0-9]{64})#sha256-([a-f0-9]{64})$'
          admit_prepared() {
            [[ "$1" =~ $prepared_pattern ]] || return 1
            [[ "${BASH_REMATCH[2]}" == "${BASH_REMATCH[3]}" ]] || return 1
            [[ "${BASH_REMATCH[4]}" == "${BASH_REMATCH[5]}" ]] || return 1
          }

          case "$RELEASE_MODE" in
            prepare-exact-sha)
              [[ -z "$PREPARED_REF" && -z "$NPM_PREPARED_REF" ]] || refuse "Preparation rejects prepared references."
              selected_job=prepare
              ;;
            create-tag)
              [[ -z "$PREPARED_REF" && -z "$NPM_PREPARED_REF" ]] || refuse "Tag creation rejects prepared references."
              selected_job=create-tag
              ;;
            certify-npm-oidc)
              admit_prepared "$PREPARED_REF" || refuse "npm OIDC certification requires one canonical prepared reference."
              [[ -z "$NPM_PREPARED_REF" ]] || refuse "npm OIDC certification rejects npm_prepared_ref."
              selected_job=certify-npm-oidc
              ;;
            publish-npm)
              admit_prepared "$PREPARED_REF" || refuse "npm publication requires one canonical prepared reference."
              [[ -z "$NPM_PREPARED_REF" ]] || refuse "npm publication rejects npm_prepared_ref."
              selected_job=publish-npm
              ;;
            publish-github)
              admit_prepared "$PREPARED_REF" || refuse "GitHub publication requires one canonical GitHub prepared reference."
              admit_prepared "$NPM_PREPARED_REF" || refuse "GitHub publication requires one canonical npm prepared reference."
              [[ "$PREPARED_REF" != "$NPM_PREPARED_REF" ]] || refuse "GitHub and npm prepared references must be distinct."
              selected_job=publish-github
              ;;
            *)
              echo "::error title=Invalid self-release authority::Release mode is not admitted."
              exit 1
              ;;
          esac
          printf 'selected_job=%s\n' "$selected_job" >> "$GITHUB_OUTPUT"

  prepare:
    needs: admit
    if: ${{ needs.admit.outputs.selected_job == 'prepare' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      github-prepared-ref: ${{ steps.github-prepare.outputs.prepared-ref }}
      npm-prepared-ref: ${{ steps.npm-prepare.outputs.prepared-ref }}
    steps:
      - name: Refuse ambient release-tool controls
        shell: bash
        run: |-
          set -euo pipefail
          while IFS='=' read -r name _; do
            normalized="$(printf '%s' "$name" | /usr/bin/tr '[:upper:]' '[:lower:]')"
            case "$normalized" in
              npm_token|npm_id_token|node_auth_token|npm_config_*|prefix|destdir|node_options|node_path|node_extra_ca_certs|node_tls_reject_unauthorized|node_use_env_proxy|ssl_cert_file|ssl_cert_dir|openssl_conf|http_proxy|https_proxy|all_proxy|no_proxy|curl_ca_bundle|bun_options|bun_config_*|ld_preload|ld_library_path|dyld_insert_libraries|dyld_library_path|dyld_framework_path|git_*)
                echo "::error title=Unsafe release host::$name must be absent."
                exit 1
                ;;
            esac
          done < <(/usr/bin/env)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"
      - id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - id: release-tools
        name: Bind exact release tool paths
        env:
          SETUP_BUN_PATH: ${{ steps.setup-bun.outputs.bun-path }}
        shell: bash
        run: |-
          set -euo pipefail
          node_path="$(type -P node)"
          bun_path="$(type -P bun)"
          [[ "$node_path" = /* && "$bun_path" = /* && -x "$node_path" && -x "$bun_path" ]]
          [[ "$("$node_path" --version)" == v22.22.2 ]]
          [[ "$("$bun_path" --version)" == 1.3.14 ]]
          [[ "$(realpath "$bun_path")" == "$(realpath "$SETUP_BUN_PATH")" ]]
          echo "node-bin=$node_path" >> "$GITHUB_OUTPUT"
          echo "bun-bin=$bun_path" >> "$GITHUB_OUTPUT"
      - name: Install audited npm release tool
        env:
          TS_RELEASE_NODE_BIN: ${{ steps.release-tools.outputs.node-bin }}
          TS_RELEASE_BUN_BIN: ${{ steps.release-tools.outputs.bun-bin }}
        run: '"$TS_RELEASE_BUN_BIN" --no-env-file --no-install apps/release-ts/scripts/install-self-release-npm.ts'
      - name: Prime isolated Bun dependency cache
        env:
          TS_RELEASE_BUN_BIN: ${{ steps.release-tools.outputs.bun-bin }}
        run: |-
          "$TS_RELEASE_BUN_BIN" install --frozen-lockfile --ignore-scripts --no-save --linker=hoisted
          "$TS_RELEASE_BUN_BIN" --no-env-file --no-install -e 'await (await import("node:fs/promises")).rm("node_modules", { recursive: true, force: true })'
      - name: Reauthenticate exact main before GitHub-byte adoption
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PREPARED_REF: ${{ inputs.prepared_ref }}
          NPM_PREPARED_REF: ${{ inputs.npm_prepared_ref }}
          RELEASE_MODE: ${{ inputs.mode }}
          TS_RELEASE_NODE_BIN: ${{ steps.release-tools.outputs.node-bin }}
          TS_RELEASE_BUN_BIN: ${{ steps.release-tools.outputs.bun-bin }}
        run: '"$TS_RELEASE_BUN_BIN" --no-env-file --no-install apps/release-ts/scripts/check-self-release-dispatch.ts'
      - id: github-prepare
        uses: ./apps/ts-release-action
        env:
          TS_RELEASE_NODE_BIN: ${{ steps.release-tools.outputs.node-bin }}
          TS_RELEASE_BUN_BIN: ${{ steps.release-tools.outputs.bun-bin }}
        with:
          command: prepare
          config: apps/release-ts/github-release.config.json
      - name: Upload redacted GitHub preparation report
        if: ${{ always() && steps.github-prepare.outputs.report-ref != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ts-release-github-prepare-report-${{ github.run_attempt }}
          path: ${{ steps.github-prepare.outputs.report-ref }}
          if-no-files-found: error
          retention-days: 7
      - name: Reauthenticate exact main before npm-byte adoption
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PREPARED_REF: ${{ inputs.prepared_ref }}
          NPM_PREPARED_REF: ${{ inputs.npm_prepared_ref }}
          RELEASE_MODE: ${{ inputs.mode }}
          TS_RELEASE_NODE_BIN: ${{ steps.release-tools.outputs.node-bin }}
          TS_RELEASE_BUN_BIN: ${{ steps.release-tools.outputs.bun-bin }}
        run: '"$TS_RELEASE_BUN_BIN" --no-env-file --no-install apps/release-ts/scripts/check-self-release-dispatch.ts'
      - id: npm-prepare
        uses: ./apps/ts-release-action
        env:
          TS_RELEASE_NODE_BIN: ${{ steps.release-tools.outputs.node-bin }}
          TS_RELEASE_BUN_BIN: ${{ steps.release-tools.outputs.bun-bin }}
        with:
          command: prepare
          config: apps/release-ts/npm-release.config.json
      - name: Upload redacted npm preparation report
        if: ${{ always() && steps.npm-prepare.outputs.report-ref != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ts-release-npm-prepare-report-${{ github.run_attempt }}
          path: ${{ steps.npm-prepare.outputs.report-ref }}
          if-no-files-found: error
          retention-days: 7

  create-tag:
    needs: admit
    if: ${{ needs.admit.outputs.selected_job == 'create-tag' }}
    runs-on: ubuntu-24.04
    environment: github-tag
    permissions:
      contents: write
    steps:
      - name: Bootstrap exact repository-owned mutation tools
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |-
          set -euo pipefail
          while IFS='=' read -r name _; do
            normalized="$(printf '%s' "$name" | /usr/bin/tr '[:upper:]' '[:lower:]')"
            case "$normalized" in
              npm_token|npm_id_token|node_auth_token|npm_config_*|prefix|destdir|node_options|node_path|node_extra_ca_certs|node_tls_reject_unauthorized|node_use_env_proxy|ssl_cert_file|ssl_cert_dir|openssl_conf|http_proxy|https_proxy|all_proxy|no_proxy|curl_ca_bundle|bun_options|bun_config_*|ld_preload|ld_library_path|dyld_insert_libraries|dyld_library_path|dyld_framework_path|git_*) exit 1 ;;
            esac
          done < <(/usr/bin/env)
          bootstrap="$RUNNER_TEMP/ts-release-bootstrap.sh"
          /usr/bin/curl --fail --silent --show-error --location --max-redirs 5 --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$bootstrap" "https://raw.githubusercontent.com/mannyc2/ts-release/$CANDIDATE_SHA/apps/release-ts/scripts/bootstrap-self-release-tools.sh"
          printf '%s  %s\n' 78d4c762e3b0fb268d260d071f65f2454a50c3d5eed1a528b645988de0704f0f "$bootstrap" | /usr/bin/sha256sum --check --status
          /bin/bash "$bootstrap" "$CANDIDATE_SHA"
      - name: Reauthenticate exact main before tag mutation
        shell: bash
        env:
          HOME: ${{ env.TS_RELEASE_HOME }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PREPARED_REF: ${{ inputs.prepared_ref }}
          NPM_PREPARED_REF: ${{ inputs.npm_prepared_ref }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: '"$TS_RELEASE_BUN_BIN" --no-env-file --no-install "$TS_RELEASE_DISPATCH_BIN"'
      - id: tag
        name: Converge exact lightweight v0.3.0 tag
        shell: bash
        env:
          HOME: ${{ env.TS_RELEASE_HOME }}
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: '"$TS_RELEASE_BUN_BIN" --no-env-file --no-install "$TS_RELEASE_TAG_BIN"'
      - name: Retain and reread the exact tag convergence report
        if: ${{ always() && steps.tag.outcome != 'skipped' }}
        uses: ./apps/ts-release-action/report-retainer
        with:
          kind: tag
          candidate-sha: ${{ inputs.candidate_sha }}
          prepared: ""

  certify-npm-oidc:
    needs: admit
    if: ${{ needs.admit.outputs.selected_job == 'certify-npm-oidc' }}
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Bootstrap exact repository-owned certification tools
        shell: bash
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |-
          set -euo pipefail
          while IFS='=' read -r name _; do
            normalized="$(printf '%s' "$name" | /usr/bin/tr '[:upper:]' '[:lower:]')"
            case "$normalized" in
              npm_token|npm_id_token|node_auth_token|npm_config_*|prefix|destdir|node_options|node_path|node_extra_ca_certs|node_tls_reject_unauthorized|node_use_env_proxy|ssl_cert_file|ssl_cert_dir|openssl_conf|http_proxy|https_proxy|all_proxy|no_proxy|curl_ca_bundle|bun_options|bun_config_*|ld_preload|ld_library_path|dyld_insert_libraries|dyld_library_path|dyld_framework_path|git_*) exit 1 ;;
            esac
          done < <(/usr/bin/env)
          bootstrap="$RUNNER_TEMP/ts-release-bootstrap.sh"
          /usr/bin/curl --fail --silent --show-error --location --max-redirs 5 --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$bootstrap" "https://raw.githubusercontent.com/mannyc2/ts-release/$CANDIDATE_SHA/apps/release-ts/scripts/bootstrap-self-release-tools.sh"
          printf '%s  %s\n' 78d4c762e3b0fb268d260d071f65f2454a50c3d5eed1a528b645988de0704f0f "$bootstrap" | /usr/bin/sha256sum --check --status
          /bin/bash "$bootstrap" "$CANDIDATE_SHA"
      - name: Reauthenticate exact main before npm OIDC certification
        shell: bash
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          HOME: ${{ env.TS_RELEASE_HOME }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PREPARED_REF: ${{ inputs.prepared_ref }}
          NPM_PREPARED_REF: ${{ inputs.npm_prepared_ref }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: '"$TS_RELEASE_BUN_BIN" --no-env-file --no-install "$TS_RELEASE_DISPATCH_BIN"'
      - id: npm-oidc-certification
        name: Certify exact npm OIDC exchange without upload
        shell: bash
        env:
          HOME: ${{ env.TS_RELEASE_HOME }}
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PREPARED_REF: ${{ inputs.prepared_ref }}
          NPM_PREPARED_REF: ${{ inputs.npm_prepared_ref }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: '"$TS_RELEASE_BUN_BIN" --no-env-file --no-install "$TS_RELEASE_NPM_OIDC_CERTIFIER_BIN"'
      - name: Retain and reread the exact npm OIDC no-upload receipt
        if: ${{ always() && steps.npm-oidc-certification.outcome != 'skipped' }}
        uses: ./apps/ts-release-action/report-retainer
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        with:
          kind: npm-oidc-certification
          candidate-sha: ${{ inputs.candidate_sha }}
          prepared: ${{ inputs.prepared_ref }}

  publish-npm:
    needs: admit
    if: ${{ needs.admit.outputs.selected_job == 'publish-npm' }}
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Bootstrap exact repository-owned mutation tools
        shell: bash
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |-
          set -euo pipefail
          while IFS='=' read -r name _; do
            normalized="$(printf '%s' "$name" | /usr/bin/tr '[:upper:]' '[:lower:]')"
            case "$normalized" in
              npm_token|npm_id_token|node_auth_token|npm_config_*|prefix|destdir|node_options|node_path|node_extra_ca_certs|node_tls_reject_unauthorized|node_use_env_proxy|ssl_cert_file|ssl_cert_dir|openssl_conf|http_proxy|https_proxy|all_proxy|no_proxy|curl_ca_bundle|bun_options|bun_config_*|ld_preload|ld_library_path|dyld_insert_libraries|dyld_library_path|dyld_framework_path|git_*) exit 1 ;;
            esac
          done < <(/usr/bin/env)
          bootstrap="$RUNNER_TEMP/ts-release-bootstrap.sh"
          /usr/bin/curl --fail --silent --show-error --location --max-redirs 5 --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$bootstrap" "https://raw.githubusercontent.com/mannyc2/ts-release/$CANDIDATE_SHA/apps/release-ts/scripts/bootstrap-self-release-tools.sh"
          printf '%s  %s\n' 78d4c762e3b0fb268d260d071f65f2454a50c3d5eed1a528b645988de0704f0f "$bootstrap" | /usr/bin/sha256sum --check --status
          /bin/bash "$bootstrap" "$CANDIDATE_SHA"
      - name: Reauthenticate exact main and tag before npm publication
        shell: bash
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          HOME: ${{ env.TS_RELEASE_HOME }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PREPARED_REF: ${{ inputs.prepared_ref }}
          NPM_PREPARED_REF: ${{ inputs.npm_prepared_ref }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: '"$TS_RELEASE_BUN_BIN" --no-env-file --no-install "$TS_RELEASE_DISPATCH_BIN"'
      - id: npm-publish
        uses: ./apps/ts-release-action
        env:
          HOME: ${{ env.TS_RELEASE_HOME }}
          GITHUB_TOKEN: ${{ github.token }}
          TS_RELEASE_NODE_BIN: ${{ env.TS_RELEASE_NODE_BIN }}
          TS_RELEASE_BUN_BIN: ${{ env.TS_RELEASE_BUN_BIN }}
        with:
          command: publish
          prepared: ${{ inputs.prepared_ref }}
      - name: Retain and reread the exact npm publication report
        if: ${{ always() && steps.npm-publish.outcome != 'skipped' }}
        uses: ./apps/ts-release-action/report-retainer
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
        with:
          kind: npm-publish
          candidate-sha: ${{ inputs.candidate_sha }}
          prepared: ${{ inputs.prepared_ref }}
      - name: Verify exact public npm bytes and report-bound provenance
        shell: bash
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          HOME: ${{ env.TS_RELEASE_HOME }}
          GITHUB_TOKEN: ${{ github.token }}
          PREPARED_REF: ${{ inputs.prepared_ref }}
          ACTION_REPORT: ${{ steps.npm-publish.outputs.report-ref }}
        run: '"$TS_RELEASE_BUN_BIN" --no-env-file --no-install "$TS_RELEASE_NPM_VERIFIER_BIN" "$PREPARED_REF" "${{ inputs.candidate_sha }}" action-report "$ACTION_REPORT"'

  preflight-github:
    needs: admit
    if: ${{ needs.admit.outputs.selected_job == 'publish-github' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-name: ${{ steps.npm-inspect-report.outputs.artifact-name }}
      artifact-id: ${{ steps.npm-inspect-report.outputs.artifact-id }}
      artifact-digest: ${{ steps.npm-inspect-report.outputs.artifact-digest }}
      report-sha256: ${{ steps.npm-inspect-report.outputs.report-sha256 }}
    steps:
      - name: Bootstrap exact repository-owned read-only verification tools
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |-
          set -euo pipefail
          while IFS='=' read -r name _; do
            normalized="$(printf '%s' "$name" | /usr/bin/tr '[:upper:]' '[:lower:]')"
            case "$normalized" in
              npm_token|npm_id_token|node_auth_token|npm_config_*|prefix|destdir|node_options|node_path|node_extra_ca_certs|node_tls_reject_unauthorized|node_use_env_proxy|ssl_cert_file|ssl_cert_dir|openssl_conf|http_proxy|https_proxy|all_proxy|no_proxy|curl_ca_bundle|bun_options|bun_config_*|ld_preload|ld_library_path|dyld_insert_libraries|dyld_library_path|dyld_framework_path|git_*) exit 1 ;;
            esac
          done < <(/usr/bin/env)
          bootstrap="$RUNNER_TEMP/ts-release-bootstrap.sh"
          /usr/bin/curl --fail --silent --show-error --location --max-redirs 5 --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$bootstrap" "https://raw.githubusercontent.com/mannyc2/ts-release/$CANDIDATE_SHA/apps/release-ts/scripts/bootstrap-self-release-tools.sh"
          printf '%s  %s\n' 78d4c762e3b0fb268d260d071f65f2454a50c3d5eed1a528b645988de0704f0f "$bootstrap" | /usr/bin/sha256sum --check --status
          /bin/bash "$bootstrap" "$CANDIDATE_SHA"
      - name: Reauthenticate exact main, tag, and both prepared references before npm preflight
        shell: bash
        env:
          HOME: ${{ env.TS_RELEASE_HOME }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PREPARED_REF: ${{ inputs.prepared_ref }}
          NPM_PREPARED_REF: ${{ inputs.npm_prepared_ref }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: '"$TS_RELEASE_BUN_BIN" --no-env-file --no-install "$TS_RELEASE_DISPATCH_BIN"'
      - id: npm-inspect
        uses: ./apps/ts-release-action
        env:
          HOME: ${{ env.TS_RELEASE_HOME }}
          GITHUB_TOKEN: ${{ github.token }}
          TS_RELEASE_NODE_BIN: ${{ env.TS_RELEASE_NODE_BIN }}
          TS_RELEASE_BUN_BIN: ${{ env.TS_RELEASE_BUN_BIN }}
        with:
          command: inspect
          prepared: ${{ inputs.npm_prepared_ref }}
      - name: Retain and reread the exact npm inspection report
        id: npm-inspect-report
        if: ${{ always() && steps.npm-inspect.outcome != 'skipped' }}
        uses: ./apps/ts-release-action/report-retainer
        with:
          kind: npm-inspect
          candidate-sha: ${{ inputs.candidate_sha }}
          prepared: ${{ inputs.npm_prepared_ref }}
      - name: Verify npm is already public with exact bytes and provenance
        shell: bash
        env:
          HOME: ${{ env.TS_RELEASE_HOME }}
          GITHUB_TOKEN: ${{ github.token }}
          NPM_PREPARED_REF: ${{ inputs.npm_prepared_ref }}
        run: '"$TS_RELEASE_BUN_BIN" --no-env-file --no-install "$TS_RELEASE_NPM_VERIFIER_BIN" "$NPM_PREPARED_REF" "${{ inputs.candidate_sha }}" published-run'

  publish-github:
    needs:
      - admit
      - preflight-github
    if: ${{ needs.admit.outputs.selected_job == 'publish-github' && needs.preflight-github.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: github-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Bootstrap exact repository-owned mutation tools
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |-
          set -euo pipefail
          while IFS='=' read -r name _; do
            normalized="$(printf '%s' "$name" | /usr/bin/tr '[:upper:]' '[:lower:]')"
            case "$normalized" in
              npm_token|npm_id_token|node_auth_token|npm_config_*|prefix|destdir|node_options|node_path|node_extra_ca_certs|node_tls_reject_unauthorized|node_use_env_proxy|ssl_cert_file|ssl_cert_dir|openssl_conf|http_proxy|https_proxy|all_proxy|no_proxy|curl_ca_bundle|bun_options|bun_config_*|ld_preload|ld_library_path|dyld_insert_libraries|dyld_library_path|dyld_framework_path|git_*) exit 1 ;;
            esac
          done < <(/usr/bin/env)
          bootstrap="$RUNNER_TEMP/ts-release-bootstrap.sh"
          /usr/bin/curl --fail --silent --show-error --location --max-redirs 5 --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$bootstrap" "https://raw.githubusercontent.com/mannyc2/ts-release/$CANDIDATE_SHA/apps/release-ts/scripts/bootstrap-self-release-tools.sh"
          printf '%s  %s\n' 78d4c762e3b0fb268d260d071f65f2454a50c3d5eed1a528b645988de0704f0f "$bootstrap" | /usr/bin/sha256sum --check --status
          /bin/bash "$bootstrap" "$CANDIDATE_SHA"
      - name: Admit exact retained npm preflight evidence
        shell: bash
        env:
          NPM_INSPECT_ARTIFACT_NAME: ${{ needs.preflight-github.outputs.artifact-name }}
          NPM_INSPECT_ARTIFACT_ID: ${{ needs.preflight-github.outputs.artifact-id }}
          NPM_INSPECT_ARTIFACT_DIGEST: ${{ needs.preflight-github.outputs.artifact-digest }}
          NPM_INSPECT_REPORT_SHA256: ${{ needs.preflight-github.outputs.report-sha256 }}
        run: |-
          set -euo pipefail
          [[ "$NPM_INSPECT_ARTIFACT_NAME" == "ts-release-npm-inspect-report-$GITHUB_RUN_ATTEMPT" ]]
          [[ "$NPM_INSPECT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$NPM_INSPECT_ARTIFACT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$NPM_INSPECT_REPORT_SHA256" =~ ^[a-f0-9]{64}$ ]]
      - name: Reauthenticate exact main immediately before GitHub publication
        shell: bash
        env:
          HOME: ${{ env.TS_RELEASE_HOME }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PREPARED_REF: ${{ inputs.prepared_ref }}
          NPM_PREPARED_REF: ${{ inputs.npm_prepared_ref }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: '"$TS_RELEASE_BUN_BIN" --no-env-file --no-install "$TS_RELEASE_DISPATCH_BIN"'
      - id: github-publish
        uses: ./apps/ts-release-action
        env:
          HOME: ${{ env.TS_RELEASE_HOME }}
          GITHUB_TOKEN: ${{ github.token }}
          TS_RELEASE_NODE_BIN: ${{ env.TS_RELEASE_NODE_BIN }}
          TS_RELEASE_BUN_BIN: ${{ env.TS_RELEASE_BUN_BIN }}
        with:
          command: publish
          prepared: ${{ inputs.prepared_ref }}
      - name: Retain and reread the exact GitHub publication report
        if: ${{ always() && steps.github-publish.outcome != 'skipped' }}
        uses: ./apps/ts-release-action/report-retainer
        with:
          kind: github-publish
          candidate-sha: ${{ inputs.candidate_sha }}
          prepared: ${{ inputs.prepared_ref }}
