name: Release

on:
  # Public mutation remains quarantined until step 233k certifies the corrected
  # kernel. The dead trigger and job guard are independent containment layers.
  push:
    branches:
      - __ts_release_quarantined__

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: ./apps/ts-release-action
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          command: release
          config: apps/release-ts/release.config.json
