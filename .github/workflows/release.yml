name: Release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current main commit to prepare and release
        required: true
        type: string
      publish:
        description: Publish the retained seven-package cohort and GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ts-release-distribution
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'mannyc2/ts-release' && github.ref == 'refs/heads/main' && github.sha == inputs.candidate_sha
    runs-on: ubuntu-latest
    outputs:
      manifest-sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - run: bun install --frozen-lockfile
      - run: bun run setup:native-python && bun run setup:native-catalog
      - run: bun run check:portable
      - name: Pack the complete release from the tested commit
        run: bun run release:prepare .release/distribution
      - name: Install and observe the exact retained archives
        run: bun scripts/check-distribution.ts .release/distribution --hosted
      - name: Exercise the committed Action on the hosted Node 24 runner
        uses: ./apps/action
        with:
          application: .release/distribution-consumer/application.mjs
          observe: 'true'
      - id: manifest
        name: Bind the retained manifest
        run: echo "sha256=$(sha256sum .release/distribution/release.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ts-release-distribution
          path: .release/distribution/
          if-no-files-found: error
          retention-days: 90

  publish-npm:
    needs: prepare
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the native provenance publisher
        run: bun add --global npm@11.11.0
      - uses: actions/download-artifact@v4
        with:
          name: ts-release-distribution
          path: .release/distribution
      - name: Verify the exact retained manifest
        env:
          MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest-sha256 }}
        run: |
          printf '%s  %s\n' "$MANIFEST_SHA256" .release/distribution/release.json | sha256sum --check
          bun run release:check .release/distribution
      - name: Publish providers, then the core, and verify registry bytes
        env:
          # Needed only for first publication before the new names have OIDC setup.
          # Subsequent releases use npm trusted publishing with no token secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/ts-release.npmrc"
            printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$NPM_CONFIG_USERCONFIG"
            chmod 600 "$NPM_CONFIG_USERCONFIG"
            trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          fi
          bun run release:publish .release/distribution --execute

  publish-github:
    needs: [prepare, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: ts-release-distribution
          path: .release/distribution
      - name: Verify the retained manifest and publish the immutable Action coordinate
        env:
          MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest-sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s  %s\n' "$MANIFEST_SHA256" .release/distribution/release.json | sha256sum --check
          bun run release:github .release/distribution --execute
