name: Release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current main commit to prepare and release
        required: true
        type: string
      publish:
        description: Sign and publish this exact seven-package candidate
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ts-release-distribution
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'mannyc2/ts-release' && github.ref == 'refs/heads/main' && github.sha == inputs.candidate_sha
    runs-on: ubuntu-latest
    outputs:
      bundle-sha256: ${{ steps.identity.outputs.bundle-sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.14"
      - run: bun install --frozen-lockfile
      - run: bun run setup:native-python && bun run setup:native-catalog
      - run: bun run check:portable
      - name: Verify native Sigstore under the publishing runtime
        run: bun run check:native-npm-sigstore
      - name: Retain the seven-package candidate without publication
        run: bun run release:prepare .release/distribution
      - name: Exercise the installed production application and Action with native HTTPS peers
        run: bun scripts/check-distribution.ts .release/distribution --hosted
      - id: identity
        run: echo "bundle-sha256=$(sha256sum .release/distribution/bundle.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ts-release-unsigned-candidate
          path: .release/distribution/
          if-no-files-found: error
          retention-days: 90

  attest:
    needs: prepare
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      bundle-sha256: ${{ steps.identity.outputs.bundle-sha256 }}
      plan-sha256: ${{ steps.identity.outputs.plan-sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - uses: actions/download-artifact@v4
        with:
          name: ts-release-unsigned-candidate
          path: .release/distribution
      - name: Sign the retained archives and author the final Bundle and Plan
        env:
          BUNDLE_SHA256: ${{ needs.prepare.outputs.bundle-sha256 }}
        run: |
          printf '%s  %s\n' "$BUNDLE_SHA256" .release/distribution/bundle.json | sha256sum --check
          bun run release:attest .release/distribution .release/signed --execute
      - id: identity
        run: |
          echo "bundle-sha256=$(sha256sum .release/signed/bundle.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "plan-sha256=$(sha256sum .release/signed/plan.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      # Retain before publication. Retry only publish after a dispatched write.
      - uses: actions/upload-artifact@v4
        with:
          name: ts-release-signed-candidate
          path: .release/signed/
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [prepare, attest]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - uses: actions/download-artifact@v4
        with:
          name: ts-release-signed-candidate
          path: .release/signed
      - name: Verify the retained Bundle and Plan
        env:
          BUNDLE_SHA256: ${{ needs.attest.outputs.bundle-sha256 }}
          PLAN_SHA256: ${{ needs.attest.outputs.plan-sha256 }}
        run: |
          printf '%s  %s\n' "$BUNDLE_SHA256" .release/signed/bundle.json | sha256sum --check
          printf '%s  %s\n' "$PLAN_SHA256" .release/signed/plan.json | sha256sum --check
          bun run release:check .release/signed
      - name: Install the exact retained packages and shared application
        run: bun scripts/install-release-runtime.ts .release/signed .release/publisher
      - name: Bind live credentials and the shared journal
        id: input
        env:
          TS_RELEASE_JOURNAL_REMOTE: https://github.com/mannyc2/ts-release.git
        run: bun scripts/release-input.ts .release/signed .release/publish-input.json Trusted --execute
      - name: Publish through the installed public providers and durable journal
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_APPLICATION: .release/publisher/application.js
          INPUT_INPUT: ${{ steps.input.outputs.application-input }}
          INPUT_OBSERVE: "false"
        # A uses/node24 step selects the runner's bundled Node, not setup-node.
        # Execute the identical Action launcher under the runtime qualified above.
        run: node apps/action/dist/launcher.cjs
      - name: Confirm public visibility using native provider observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .release/publisher/verify.mjs .release/publisher/application.js .release/publish-input.json
