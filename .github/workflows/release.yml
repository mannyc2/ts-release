name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'mannyc2/ts-release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      plan_id: ${{ steps.plan.outputs.plan_id }}
      execution_review_id: ${{ steps.review.outputs.execution_review_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check:release
      - id: plan
        uses: ./apps/ts-release-action
        with:
          command: plan
          config: apps/release-ts/release.config.json
          plan-path: .release/release-plan.json
      - id: review
        uses: ./apps/ts-release-action
        with:
          command: apply
          review-only: "true"
          plan-path: .release/release-plan.json
          plan-id: ${{ steps.plan.outputs.plan_id }}
          scope: all
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: .release/release-plan.json

  materialize:
    needs: plan
    runs-on: ubuntu-latest
    environment: release
    outputs:
      publish_review_id: ${{ steps.apply.outputs.publish_review_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: .release
      - id: apply
        uses: ./apps/ts-release-action
        with:
          command: apply
          plan-path: .release/release-plan.json
          plan-id: ${{ needs.plan.outputs.plan_id }}
          through: validate
          new-run: .release/run.json
          scope: all
          confirm-execution: ${{ needs.plan.outputs.execution_review_id }}
          reviewer: ${{ github.actor }}
      - uses: actions/upload-artifact@v4
        with:
          name: materialized-release
          path: .release

  publish:
    needs: [plan, materialize]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: materialized-release
          path: .release
      - uses: ./apps/ts-release-action
        with:
          command: apply
          plan-path: .release/release-plan.json
          plan-id: ${{ needs.plan.outputs.plan_id }}
          through: verify
          resume: .release/run.json
          confirm-publish: ${{ needs.materialize.outputs.publish_review_id }}
          reviewer: ${{ github.actor }}
