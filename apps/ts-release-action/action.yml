name: ts-release
description: Prepare and publish one release automatically.
author: mannyc2
inputs:
  config:
    description: Workspace-contained authored release configuration path.
    required: false
    default: release.config.json
  prepared:
    description: Workspace-contained directory for the exact prepared release bundle.
    required: false
    default: .release/ts-release/prepared
  npm-token:
    description: npm token used for read and publish observation when npm is configured.
    required: false
  github-token:
    description: GitHub token used for read and publish observation when GitHub is configured.
    required: false
outputs:
  prepared:
    description: Directory containing the exact prepared release bundle.
  status:
    description: Release status.
runs:
  using: node20
  main: dist/index.js
branding:
  icon: package
  color: blue
