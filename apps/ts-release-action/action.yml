name: ts-release
description: Prepare, publish, inspect, or correct one exact release boundary.
author: mannyc2
inputs:
  command:
    description: One of prepare, publish, inspect, or correct.
    required: true
  config:
    description: Workspace-contained authored configuration path for prepare or inspect.
    required: false
  prepared:
    description: Workspace-contained exact prepared bundle path for publish, inspect, or correct.
    required: false
  correction:
    description: Workspace-contained canonical provider-specific correction path for correct.
    required: false
outputs:
  status:
    description: Command completion status.
  prepared_path:
    description: Exact prepared bundle path produced by prepare.
  report_path:
    description: Workspace-contained JSON report for the command result.
runs:
  using: node20
  main: dist/index.js
branding:
  icon: package
  color: blue
