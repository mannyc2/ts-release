name: ts-release
description: Durably prepare, publish, or automatically release one exact release boundary.
author: mannyc2
inputs:
  command:
    description: One of release, prepare, or publish.
    required: true
  config:
    description: Workspace-contained authored configuration path for release or prepare.
    required: false
  prepared:
    description: Canonical prepared:gha reference for publish.
    required: false
outputs:
  prepared-ref:
    description: Durable content-addressed prepared release reference.
  report-ref:
    description: Workspace-contained redacted Action report reference.
runs:
  using: node24
  main: dist/launcher.cjs
branding:
  icon: package
  color: blue
