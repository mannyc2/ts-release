name: ts-release
description: Durably prepare, publish, or automatically release one exact release boundary.
author: mannyc2
inputs:
  command:
    description: One of release, prepare, or publish.
    required: true
  config:
    description: Workspace-contained authored configuration path for release or prepare.
    required: false
  prepared:
    description: Canonical prepared:gha reference for publish.
    required: false
outputs:
  prepared-ref:
    description: Durable content-addressed prepared release reference.
    value: ${{ steps.execute.outputs.prepared-ref }}
  report-ref:
    description: Workspace-contained redacted Action report reference.
    value: ${{ steps.execute.outputs.report-ref }}
runs:
  using: composite
  steps:
    - if: ${{ inputs.command != 'publish' }}
      shell: bash
      run: |
        cache="${BUN_INSTALL_CACHE_DIR:-$HOME/.bun/install/cache}"
        env -i PATH="$PATH" HOME="$HOME" BUN_INSTALL_CACHE_DIR="$cache" \
          bun --no-env-file --no-install "$GITHUB_ACTION_PATH/scripts/preload-bun-compile-runtimes.ts"
    - id: execute
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_PREPARED: ${{ inputs.prepared }}
      run: bun "$GITHUB_ACTION_PATH/dist/index.js"
branding:
  icon: package
  color: blue
