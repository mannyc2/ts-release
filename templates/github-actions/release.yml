# The whole staged pipeline, composed. Protect the environment in
# Settings → Environments to require an approval between plan, materialize, and
# publish; leave it unprotected for a one-shot pipeline — the run's receipts
# record which you chose.
name: Release
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  release:
    uses: mannyc2/ts-release/.github/workflows/release.yml@__TS_RELEASE_ACTION_REF__
    with:
      config: release.config.json
      environment: release
      bun-version: "1.3.14"
      setup: bun install --frozen-lockfile
    secrets: inherit
