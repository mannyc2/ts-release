name: Reviewed release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      prepared-ref: ${{ steps.prepare.outputs.prepared-ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - id: prepare
        uses: mannyc2/ts-release/apps/ts-release-action@v0.2.0
        with:
          command: prepare
          config: release.config.json

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - uses: mannyc2/ts-release/apps/ts-release-action@v0.2.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          command: publish
          prepared: ${{ needs.prepare.outputs.prepared-ref }}
