name: Reviewed release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - id: prepare
        uses: mannyc2/ts-release/apps/ts-release-action@__TS_RELEASE_ACTION_REF__
        with:
          command: prepare
          config: release.config.json
      - run: |
          set -euo pipefail
          bundle='${{ steps.prepare.outputs.prepared_path }}'
          test -d "$bundle"
          digest="$(basename "$bundle")"
          mkdir -p .release/ts-release/transfer
          cp -a "$bundle" ".release/ts-release/transfer/$digest"
      - uses: actions/upload-artifact@v4
        with:
          name: ts-release-prepared
          path: .release/ts-release/transfer
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: ts-release-prepared
          path: .release/ts-release/transfer
      - id: bundle
        run: |
          set -euo pipefail
          bundle="$(find .release/ts-release/transfer -mindepth 1 -maxdepth 1 -type d -print)"
          test -n "$bundle"
          test "$(printf '%s\n' "$bundle" | wc -l)" = 1
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
      - uses: mannyc2/ts-release/apps/ts-release-action@__TS_RELEASE_ACTION_REF__
        with:
          command: inspect
          prepared: ${{ steps.bundle.outputs.path }}
      - uses: mannyc2/ts-release/apps/ts-release-action@__TS_RELEASE_ACTION_REF__
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          command: publish
          prepared: ${{ steps.bundle.outputs.path }}
